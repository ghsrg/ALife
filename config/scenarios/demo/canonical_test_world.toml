copy_requires = { nucleotide_precursor = 1.0, phosphate = 0.5, short_peptide = 0.25, catalyst_mineral = 0.1 }
recombination_requires = { nucleotide_precursor = 0.6, phosphate = 0.4, short_peptide = 0.4, catalyst_mineral = 0.2 }
degradation_outputs = { phosphate = 0.2, mineral_salt = 0.2, inert_waste = 0.4 }
failed_attempt_rule = "No resource, energy, genome, progress, carrier, or lineage mutation on rejection."

[canonical_manifests.material_fragments]
source = "degraded cell MaterialInstance or genome carrier material"
inactive_outside_cell = true
conversion_reaction = "spent_material_fragment_conversion"
silent_resource_uptake_allowed = false

[canonical_manifests.fields]
runtime_kind = "scalar_only"
supported_scalar_profiles = ["temperature", "light", "pressure", "radiation", "chemical_gradient", "flow"]
unsupported_direct_effects = ["field_to_energy_buffer", "field_to_cell_movement", "field_to_genome_mutation", "field_to_material_damage", "field_to_resource_transport", "field_to_genome_behavior"]
notes = "Profile names are accepted as bounded scalar runtime fields only; direct behavior requires a separate explicit material, reaction, process, or physics mechanism."

[canonical_manifests.fields.temperature]
field_id = "temperature"
runtime_owner_slice = "AL-003-S09"
local_effects = ["resource_decay_rate", "material_degradation_rate", "heat_dissipation"]
forbidden_effects = ["direct_energy_credit", "direct_genome_output", "global_behavior_command"]

