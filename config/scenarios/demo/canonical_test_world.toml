[canonical_manifests]
schema = "canonical_test_world_manifest_v1"
purpose = "Forward contract for resource-derived material synthesis, physical Genome precursor accounting, and local Field runtime."
runtime_status = "field_runtime_supported"
unsupported_until = []

[canonical_manifests.genome_precursors]
carrier_material_id = "genome_carrier_matrix"
carrier_synthesis_reaction = "genome_carrier_matrix_synthesis"
copy_process_id = "genome_copying"
