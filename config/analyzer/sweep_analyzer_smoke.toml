# Smoke-test config — 100 ticks, small sweeps
[run]
output_dir = "outputs/raw_data/smoke"
seed       = 42
ticks      = 100

[cell]
radius                    = 1.0
initial_energy            = 50.0
energy_capacity           = 100.0
mandatory_cost_per_tick   = 2.0
passive_energy_income     = 0.0
capacity_limit            = 30.0
initial_metabolic_material = 1.0
initial_transport_material = 1.0
initial_boundary_material  = 1.0
initial_structural_material= 1.0

[lifecycle]
stress_energy_threshold         = 10.0
dormancy_allowed                = true
dormant_mandatory_cost_modifier = 0.1
critical_capacity_overrun       = 5.0

[resource_interaction]
energy_per_resource              = 10.0
heat_per_resource                = 0.1
waste_per_resource               = 0.1
decay_rate                       = 0.01
default_resource_density         = 10.0
default_max_uptake_per_tick      = 1.0
default_metabolism_resource_per_tick = 0.5

[environment]
heat_dissipation_rate   = 0.2
heat_warning_threshold  = 50.0
heat_death_threshold    = 80.0
waste_sink_rate         = 0.1
waste_warning_threshold = 10.0
waste_death_threshold   = 20.0

[[sweep]]
name  = "finite_resource_viability"
scenario = "finite_resource_viability"
param = "resource_density"
from  = 0.0
to    = 20.0
steps = 6

[[sweep]]
name  = "passive_income_survival"
scenario = "passive_income_survival"
param = "passive_energy_income"
from  = 0.10
to    = 0.50
steps = 5

[[sweep]]
name  = "steady_resource_flow"
scenario = "steady_resource_flow"
param = "mandatory_cost_per_tick"
from  = 0.05
to    = 5.0
steps = 5

[[sweep]]
name  = "dormancy_survival"
scenario = "dormancy_survival"
param = "dormant_mandatory_cost_modifier"
from  = 0.02
to    = 0.50
steps = 5

[[sweep]]
name  = "active_metabolism_viability"
scenario = "active_metabolism_viability"
param = "max_uptake_per_tick"
from  = 0.1
to    = 2.0
steps = 5

[[matrix]]
name      = "resource_abundance"
scenario  = "resource_abundance"
param_x   = "max_uptake_per_tick"
from_x    = 0.1
to_x      = 2.0
steps_x   = 4
param_y   = "metabolism_resource_per_tick"
from_y    = 0.1
to_y      = 2.0
steps_y   = 4

[[sweep]]
name  = "division_viability"
scenario = "division_viability"
param = "max_division_pressure"
from  = 0.1
to    = 0.8
steps = 5

[[sweep]]
name  = "decomposition_viability"
scenario = "decomposition_viability"
param = "decomposition_resources_per_tick"
from  = 1.0
to    = 5.0
steps = 5

[[sweep]]
name  = "local_interaction_viability"
scenario = "local_interaction_viability"
param = "contact_exchange_rate"
from  = 0.0
to    = 1.0
steps = 3

[[sweep]]
name = "resource_type_decay_diffusion"
scenario = "resource_type_decay_diffusion"
param = "nutrient_decay_rate"
from = 0.0
to = 0.2
steps = 3

[[sweep]]
name = "material_type_degradation"
scenario = "material_type_degradation"
param = "material_decay_rate"
from = 0.0
to = 0.5
steps = 3

[[sweep]]
name = "passive_reaction_viability"
scenario = "passive_reaction_viability"
param = "passive_reaction_rate"
from = 0.0
to = 1.5
steps = 3

[[sweep]]
name = "controlled_reaction_feasibility"
scenario = "controlled_reaction_feasibility"
param = "controlled_reaction_rate"
from = 0.0
to = 1.0
steps = 3

[[sweep]]
name = "fragment_decomposition_conversion"
scenario = "fragment_decomposition_conversion"
param = "decomposition_materials_per_tick"
from = 0.0
to = 1.0
steps = 3

[[sweep]]
name = "local_heat_degradation"
scenario = "local_heat_degradation"
param = "reaction_heat_output"
from = 0.0
to = 2.0
steps = 3

[[sweep]]
name = "boundary_retention_leakage"
scenario = "boundary_retention_leakage"
param = "contact_exchange_rate"
from = 0.0
to = 1.0
steps = 3

[[sweep]]
name = "repair_viability"
scenario = "repair_viability"
param = "repair_amount_per_tick"
from = 0.0
to = 1.0
steps = 3

[[sweep]]
name = "joint_creation_viability"
scenario = "joint_creation_viability"
param = "joint_mechanical_strength"
from = 0.05
to = 1.25
steps = 3

[[sweep]]
name = "joint_resource_channel"
scenario = "joint_resource_channel"
param = "joint_resource_transfer_rate"
from = 0.0
to = 1.0
steps = 2

[[sweep]]
name = "joint_signal_delay"
scenario = "joint_signal_delay"
param = "joint_signal_conductivity"
from = 0.0
to = 1.0
steps = 2

[[sweep]]
name = "joint_heat_channel"
scenario = "joint_heat_channel"
param = "joint_heat_conductivity"
from = 0.0
to = 1.0
steps = 2

[[sweep]]
name = "joint_degradation_break"
scenario = "joint_degradation_break"
param = "joint_decay_rate"
from = 0.0
to = 0.8
steps = 2

[[sweep]]
name = "joint_lifecycle_division"
scenario = "joint_lifecycle_division"
param = "joint_mechanical_strength"
from = 0.1
to = 1.0
steps = 2

[[sweep]]
name = "integrated_world_baseline"
scenario = "world_baseline_stable"
param = "mandatory_cost_per_tick"
from = 0.02
to = 0.08
steps = 3

# Scenarios Presets
[scenarios.finite_resource_viability]
[scenarios.passive_income_survival]
[scenarios.steady_resource_flow]

[scenarios.dormancy_survival]
passive_energy_income = 0.05
dormancy_allowed = true

[scenarios.resource_abundance]
passive_energy_income = 1.5

[scenarios.active_metabolism_viability]
decay_rate = 0.0
passive_energy_income = 0.0
initial_resources = [4000.0]

[scenarios.division_viability]
growth_enabled = true
division_enabled = true
initial_resources = [4000.0]
waste_death_threshold = 100.0
waste_sink_rate = 0.8

[scenarios.decomposition_viability]
decomposition_enabled = true
initial_energy = 1.0
mandatory_cost_per_tick = 5.0
decomposition_resources_per_tick = 1.0
decomposition_materials_per_tick = 1.0
continue_after_collapse_ticks = 50

[scenarios.local_interaction_viability]
world_size = [64.0, 64.0]
cell_radius = 2.0
initial_energy = 20.0
mandatory_cost_per_tick = 0.0
capacity_limit = 50.0
initial_cell_count = 2
overlap_offset = 3.0
source_cell_resources = 10.0
target_cell_resources = 0.0
enable_local_interaction = true

[scenarios.resource_type_decay_diffusion]
phase2g_enabled = true
phase2g_mode = "resource_type_decay_diffusion"
mandatory_cost_per_tick = 0.0
initial_energy = 20.0

[scenarios.material_type_degradation]
phase2g_enabled = true
phase2g_mode = "material_type_degradation"
mandatory_cost_per_tick = 0.0
initial_energy = 20.0

[scenarios.passive_reaction_viability]
phase2g_enabled = true
phase2g_mode = "passive_reaction_viability"
mandatory_cost_per_tick = 0.0
initial_energy = 20.0

[scenarios.controlled_reaction_feasibility]
phase2g_enabled = true
phase2g_mode = "controlled_reaction_feasibility"
mandatory_cost_per_tick = 0.0
initial_energy = 20.0

[scenarios.fragment_decomposition_conversion]
phase2g_enabled = true
phase2g_mode = "fragment_decomposition_conversion"
decomposition_enabled = true
initial_energy = 1.0
mandatory_cost_per_tick = 5.0
continue_after_collapse_ticks = 20

[scenarios.local_heat_degradation]
phase2g_enabled = true
phase2g_mode = "local_heat_degradation"
mandatory_cost_per_tick = 0.0
initial_energy = 20.0

[scenarios.boundary_retention_leakage]
phase2g_enabled = true
phase2g_mode = "boundary_retention_leakage"
world_size = [64.0, 64.0]
cell_radius = 2.0
initial_cell_count = 2
overlap_offset = 3.0
source_cell_resources = 10.0
target_cell_resources = 0.0
enable_local_interaction = true
mandatory_cost_per_tick = 0.0

[scenarios.repair_viability]
phase2g_enabled = true
phase2g_mode = "repair_viability"
mandatory_cost_per_tick = 0.0
initial_energy = 20.0

[scenarios.joint_creation_viability]
phase2h_enabled = true
phase2h_mode = "joint_creation_viability"

[scenarios.joint_resource_channel]
phase2h_enabled = true
phase2h_mode = "joint_resource_channel"

[scenarios.joint_signal_delay]
phase2h_enabled = true
phase2h_mode = "joint_signal_delay"

[scenarios.joint_heat_channel]
phase2h_enabled = true
phase2h_mode = "joint_heat_channel"

[scenarios.joint_degradation_break]
phase2h_enabled = true
phase2h_mode = "joint_degradation_break"

[scenarios.joint_lifecycle_division]
phase2h_enabled = true
phase2h_mode = "joint_lifecycle_division"

[scenarios.world_baseline_stable]
scenario_path = "config/scenarios/world/world_baseline_stable.toml"
